    #   ↑ 对力更硬（环路增益低、抗振强），↓ 更顺从；线性推荐 3000(软)/8000(中)/15000(硬)，旋转取 1/20
    compliance_hybrid_force_ki: 1.0          # 积分增益；↑ 消重力残差快，但接触刚性物体易过冲振荡，推荐 0.5~2.0
    compliance_hybrid_force_ki_max: 5.0      # 积分上限 [N]；>10 在接触时易 wind-up 成极限环
    compliance_hybrid_force_ki_leak: 1.0     # 积分泄漏 [1/s]；↑ 抗拖拽 wind-up，推荐 0.5~1.5
    compliance_hybrid_force_deadband: 0.5    # 力误差死区 [N]；↑ 防重力残差漂移但接触响应变钝，推荐 0.3~1.0
    compliance_force_vel_lpf_alpha: 0.15     # 导纳输出低通(虚拟惯性)；↑ 跟随快但噪声穿透，↓ 更平滑，推荐 0.1~0.25

    # ── 速度/位移限幅 ──
    compliance_hybrid_cart_vmax: [0.15, 0.15, 0.15, 0.6, 0.6, 0.6]  # [m/s, rad/s]；↑ 响应快但易冲过头，推荐 0.1~0.2 / 0.45~0.6
    compliance_hybrid_force_xmax_lin: 0.2           # 力控平移行程上限 [m]；↑ 可达范围大、↓ 更安全，推荐 0.1~0.3
    compliance_hybrid_force_xmax_ang: 0.3           # 力控旋转行程上限 [rad]；推荐 0.2~0.4
    compliance_hybrid_force_xmax_margin_ratio: 0.2  # 软限渐缓区占比（0~0.9）
    compliance_hybrid_joint_vmax: 0.8               # 关节速度上限 [rad/s]；↑ 跟随快，推荐 0.5~1.0
    compliance_hybrid_joint_limit_margin: 0.02      # 关节限位裕度 [rad]

    # ── 逆解 v_des → qdot ──
    compliance_hybrid_inverse_method: DLS      # DLS=快；接近限位/奇异、限速后方向被拉偏时改 QP（限幅在求解内处理）
    compliance_hybrid_dls_lambda: 0.05         # ↑ 奇异附近更稳、跟踪变差，推荐 0.02~0.1
    compliance_hybrid_qp_lambda: 1.0           # QP 正则化，需 ≥ dls_lambda

    # ── 力信号与零力校准 ──
    compliance_wrench_lpf_alpha: 0.15       # wrench EMA；↓ 更平滑但滞后大（刚性接触易振荡），↑ 噪声穿透多；推荐 0.15~0.25
    compliance_zero_cal_duration: 0.5       # [s]；↑ 更稳但等更久，推荐 0.3~1.0
    compliance_zero_cal_settle: 0.0         # [s]；校准前静止等待
    compliance_zero_cal_still_vel: 0.02     # [rad/s]；低于此速度才允许校准
    compliance_gravity_accel: 9.81          # 重力加速度 [m/s²]
    compliance_ft_timeout_sec: 0.2          # [s]；超时判 FT 失效并停用该侧力控，↑容忍掉帧、↓更安全

    # ── 遥操作与坐标系 ──
    compliance_teleop_enable: true          # 是否接受 /left_target、/right_target
    compliance_gravity_frame: world          # 重力补偿参考系

    # ── 腰部 body_joint4（yaw，全身模型含腰部，直接写关节指令）──
    compliance_waist_enable: true
    compliance_waist_joint: body_joint4
    compliance_waist_mode: follow_target   # manual=跟 /compliance_waist_target 绝对角；follow_target=腰跟随目标方位
    compliance_waist_soft_limit: 1.047     # [rad] ≈60°，|q| 软限位；↑ 范围更大但手臂远离舒适区，推荐 0.5~1.05
    compliance_waist_rate: 0.12            # [rad/s] 指令速率；↑ 跟得快，但 r·ω 会顶到 cart_vmax，推荐 0.08~0.15
    compliance_waist_gain: 0.5             # [1/s] 方位残差 → 角速率；↑ 跟得紧、易抖；符号反了取负，推荐 0.3~1.0
    compliance_waist_deadband: 0.005       # [rad]；↑ 更稳但留残差，推荐 0.003~0.01
    compliance_waist_comfort: 0.35         # [rad] ≈20°，超出才动腰；↑ 少动腰、多靠手臂，推荐 0.25~0.5
    compliance_waist_cond_max: 12.0        # 手臂条件数门槛，超过则门限减半（更早介入）；推荐 8~15，<=0 关闭
    compliance_waist_filter_tau: 0.2       # [s] 方位残差低通；↑ 更平滑但滞后，推荐 0.1~0.4
