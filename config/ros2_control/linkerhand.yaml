# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # update_rate: 100  # Hz

    # joint_state_broadcaster:
    #   type: joint_state_broadcaster/JointStateBroadcaster

    # # 双臂控制器 - 使用ocs2 arm controller
    # ocs2_arm_controller:
    #   type: ocs2_arm_controller/Ocs2ArmController

    # # 全身控制器 - 使用ocs2 arm controller
    # ocs2_wbc_controller:
    #   type: ocs2_arm_controller/Ocs2ArmController

    # # 头部控制器 - 使用basic joint controller
    # head_joint_controller:
    #   type: basic_joint_controller/BasicJointController

    # # 身体控制器 - 使用basic joint controller
    # body_joint_controller:
    #   type: basic_joint_controller/BasicJointController

    # 左手夹爪控制器
    left_hand_controller:
      type: basic_joint_controller/BasicJointController

    # 右手夹爪控制器
    right_hand_controller:
      type: basic_joint_controller/BasicJointController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4
      - head_joint1
      - head_joint2
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
      - left_hand_thumb_joint1
      - left_hand_thumb_joint2
      - left_hand_index_joint
      - left_hand_middle_joint
      - left_hand_ring_joint
      - left_hand_pinky_joint
      - right_hand_thumb_joint1
      - right_hand_thumb_joint2
      - right_hand_index_joint
      - right_hand_middle_joint
      - right_hand_ring_joint
      - right_hand_pinky_joint

