# Common controller defaults shared by all ros2_control variants.

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # FT sensor broadcasters — publish left_ft_sensor / right_ft_sensor as WrenchStamped.
    # Only activate when the URDF declares the sensors (launch passes left_ft/right_ft).
    # Default topics: /left_ft_broadcaster/wrench  /right_ft_broadcaster/wrench
    left_ft_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    right_ft_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    # 双臂控制器 - 使用ocs2 arm controller
    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    # 全身控制器 - OCS2 轮式人形 WBC
    ocs2_wbc_controller:
      type: ocs2_wbc_controller/Ocs2WbcController

    # 头部关节已纳入 ocs2_wbc_controller 统一管理（腰头耦合），不再使用独立头部控制器
    head_joint_controller:
        type: basic_joint_controller/BasicJointController

    # 身体控制器 - 使用basic joint controller
    body_joint_controller:
      type: basic_joint_controller/BasicJointController

    # 左手夹爪控制器
    left_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    # 右手夹爪控制器
    right_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    # 左手夹爪控制器
    left_hand_controller:
      type: basic_joint_controller/BasicJointController

    # 右手夹爪控制器
    right_hand_controller:
      type: basic_joint_controller/BasicJointController


ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 500  # Hz
    mpc_frequency: 50
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: m6_ccs
    info_file_name: task
    home_duration: 5.0
    movel_trajectory_duration: 6.0
    movel_duration: 2.0
    movel_sample_interval: 0.04
    movel_max_linear_velocity: 0.3
    movel_max_linear_acceleration: 1.0
    movel_max_linear_jerk: 2.0
    movel_max_angular_velocity: 1.0
    movel_max_angular_acceleration: 2.0
    movel_max_angular_jerk: 4.0
    movel_auto_extend_duration: true
    movej_interpolation_type: doubles
    home_interpolation_type: doubles

    cartesian_defaults:
      frame_id: arm_base
      ik_type: AUTO
      max_linear_velocity: 0.3
      max_linear_acceleration: 1.0
      max_linear_jerk: 5.0
      max_angular_velocity: 0.5
      max_angular_acceleration: 1.0
      max_angular_jerk: 5.0

    home_1: [ 1.457133809892805, -1.0633699963902674, -1.1994065285584414, -0.8074199090303408, -0.6949558811978124, -0.6864381599253574, -0.1295225067208675,
              -1.457133809892805, -1.0633699963902674, 1.1994065285584414, -0.8074199090303408, 0.6949558811978124, -0.6864381599253574, 0.1295225067208675]
    home_2: [ 2.502, -1.528, -1.562, -1.680, 0.0, -0.787, 0.0,
              -2.502, -1.528, 1.562, -1.680, 0.0, -0.787, 0.0 ]

ocs2_wbc_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 500  # Hz
    mpc_frequency: 100
    info_file_name: fixed_base
    # 关节顺序须与 fixed_base.info 的 arm 状态向量一致：
    # [body_joint1~4 | left_joint1~7 | right_joint1~7 | head_joint1~2]
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
      - head_joint1
      - head_joint2

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: fiveages_w2
    home_duration: 5.0
    movej_interpolation_type: doubles
    movej_max_velocity: 1.2
    movej_trajectory_blend_ratio: 0.1

    #腰部升降配置
    waist_lifting_enabled: true
    waist_lifting_duration: 3.0  # 腰部升降运动时间
    waist_lifting_type: three_joint  # 可选: three_joint 或 single_joint
    waist_l1: 0.322  # 第一连杆长度
    waist_l2: 0.355 # 第二连杆长度
    waist_rotation_direction: [ 1.0, -1.0, 1.0 ]  # 旋转方向
    waist_angle_offset: [ 0.0, 0.0, 0.0 ]  # 角度偏移
    waist_lifting_default_parameter: [ 0.02,0.5,1.0 ]  # 腰部升降参数，第一个为目标速度，第二个为最大加速度，第三个为最大加加速度
    waist_turning_default_parameter: [ 0.2,0.5,1.0 ]  # 腰部旋转参数，第一个为目标速度，第二个为最大加速度，第三个为最大加加速度
    waist_turning_direction: -1.0  # body_joint4 方向：左转为正，FA_W2 关节轴为 -Z
    waist_phi_default_parameter: [ 0.2,0.5,1.0 ]  # body_joint3 phi 速度参数，第一个为目标速度，第二个为最大加速度，第三个为最大加加速度

    cartesian_defaults:
      frame_id: arm_base
      ik_type: AUTO
      max_linear_velocity: 0.3
      max_linear_acceleration: 1.0
      max_linear_jerk: 5.0
      max_angular_velocity: 0.5
      max_angular_acceleration: 1.0
      max_angular_jerk: 5.0

    # fixed_base: [body x4 | left x7 | right x7 | head x2]；腰部前 4 维与 body_joint_controller 一致
    home_1: [ -0.9, -1.8, -0.9, 0.0,
              1.457133809892805, -1.0633699963902674, -1.1994065285584414, -0.8074199090303408, -0.6949558811978124, -0.6864381599253574, -0.1295225067208675,
              -1.457133809892805, -1.0633699963902674, 1.1994065285584414, -0.8074199090303408, 0.6949558811978124, -0.6864381599253574, 0.1295225067208675,
              0.0, 0.0]
    home_2: [ -1.3, -2.6, -1.3, 0.0,
              2.502, -1.528, -1.562, -1.680, 0.0, -0.787, 0.0,
              -2.502, -1.528, 1.562, -1.680, 0.0, -0.787, 0.0,
              0.0, 0.0]

# 头部关节控制器配置
head_joint_controller:
  ros__parameters:
    update_rate: 100  # Hz
    
    # 头部关节
    joints:
      - head_joint1
      - head_joint2
    
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    home_duration: 5.0
    movej_duration: 5.0
    hold_position_threshold: 0.1

    home_1: [0.0, 0.0]
    home_2: [0.0, 0.0]
    home_3: [0.0, 0.0]
    home_4: [0.0, 0.0]

body_joint_controller:
  ros__parameters:
    update_rate: 100  # Hz

    # 身体关节
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    home_duration: 5.0
    movej_duration: 2.0
    hold_position_threshold: 0.1
    movej_interpolation_type: doubles
    movej_max_velocity: 1.2
    home_interpolation_type: doubles

    home_1: [-0.9, -1.8, -0.9, 0.0]
    home_2: [-1.3, -2.6, -1.3, 0.0]

    #腰部升降配置
    waist_lifting_enabled: true
    waist_lifting_duration: 3.0  # 腰部升降运动时间
    waist_lifting_type: three_joint  # 可选: three_joint 或 single_joint
    waist_l1: 0.322  # 第一连杆长度
    waist_l2: 0.355 # 第二连杆长度
    waist_rotation_direction: [1.0, -1.0, 1.0]  # 旋转方向
    waist_angle_offset: [0.0, 0.0, 0.0]  # 角度偏移
    waist_lifting_default_parameter: [0.02,0.5,1.0]  # 腰部升降参数，第一个为目标速度，第二个为最大加速度，第三个为最大加加速度
    waist_turning_default_parameter: [0.2,0.5,1.0]  # 腰部旋转参数，第一个为目标速度，第二个为最大加速度，第三个为最大加加速度
    waist_turning_direction: -1.0  # body_joint4 方向：左转为正，FA_W2 关节轴为 -Z
    waist_phi_default_parameter: [0.2,0.5,1.0]  # body_joint3 phi 速度参数，第一个为目标速度，第二个为最大加速度，第三个为最大加加速度


# 左手夹爪控制器配置
left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    use_effort_interface: false

# 右手夹爪控制器配置
right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    use_effort_interface: false

# FT sensor broadcasters — publish WrenchStamped from sensor state interfaces.
# Auto-detects sensor presence: if the URDF declares left_ft_sensor / right_ft_sensor
# (via launch arg left_ft/right_ft), the broadcaster activates; otherwise inactive.
# Default topics: /left_ft_broadcaster/wrench  /right_ft_broadcaster/wrench
left_ft_broadcaster:
  ros__parameters:
    sensor_name: left_ft_sensor
    # KWR75 is mounted at the wrist/TCP; *_eef may be the gripper tip and
    # gives the wrong moment origin for payload torque compensation.
    frame_id: left_tcp

right_ft_broadcaster:
  ros__parameters:
    sensor_name: right_ft_sensor
    frame_id: right_tcp
