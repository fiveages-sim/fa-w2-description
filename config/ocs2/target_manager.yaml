/**:
  ros__parameters:
    # 线性控制缩放因子：映射到 */twist 的线速度上限 (m/s，满杆)
    linear_scale: 0.1
    
    # 角度控制缩放因子：映射到 */twist 的角速度上限 (rad/s，满杆)
    angular_scale: 0.25

    marker_fixed_frame: base_footprint
    # 是否启用VR输入处理
    enable_vr: true
    # 全身控制下 VR 目标相对底盘保持；发布前转换到 WBC 控制 frame
    vr_follow_frame: base_footprint
    # 仅 full_body.launch.py 在确认使用 Ocs2WbcController 时覆盖为 true
    enable_wbc_head_tracking_marker: false
    # WBC 6D Marker 切入 HEAD_TRACKING 时用它初始化目标位姿
    head_link_name: "head_link2"

    # VR 头显参考 link（VR 校准时关联头显与机器人头部）
    # 由 VRInputHandler 使用；与 head_link_name 独立，即使不开头部控制也会生效
    reference_link: "head_link2"
