/**:
  ros__parameters:
    # 线性控制缩放因子：映射到 */twist 的线速度上限 (m/s，满杆)
    linear_scale: 0.1
    
    # 角度控制缩放因子：映射到 */twist 的角速度上限 (rad/s，满杆)
    angular_scale: 0.25

    marker_fixed_frame: base_footprint
    # 是否启用VR输入处理
    enable_vr: true
    # 全身控制下 VR 目标相对底盘保持；发布前转换到 WBC 控制 frame
    vr_follow_frame: base_footprint
    enable_head_control: false
    
    # 头部关节映射配置（可选）
    # 如果配置了，将使用此映射而不是自动检测
    # 格式：head_joint_to_rpy_mapping.<joint_name> = <rpy_name>
    # 示例：将xacro中的关节名称映射到RViz marker的RPY角度
    head_joint_to_rpy_mapping:
      head_joint1: "head_yaw"    # head_joint1 对应 RViz marker 的 yaw 角度
      head_joint2: "head_pitch"  # head_joint2 对应 RViz marker 的 pitch 角度
      # head_joint3: "head_roll"  # 如果不需要roll，可以留空或省略
    
    
    # 旋转轴方向配置（可选）
    # 如果旋转轴方向是反的，设置为-1.0，否则为1.0（默认）
    # 格式：head_rpy_axis_direction.<rpy_name> = 1.0 或 -1.0（必须是浮点数）
    head_rpy_axis_direction:
      head_yaw: 1.0      # yaw轴方向：1.0表示正方向，-1.0表示反向
      head_pitch: 1.0   # pitch轴方向：1.0表示正方向，-1.0表示反向
      head_roll: 1.0     # roll轴方向：1.0表示正方向，-1.0表示反向
    
    # 头部 TF link（仅 enable_head_control=true 时生效）
    # HeadMarker 用它从 TF 取头部实际位置来更新 RViz 头部 marker；当前未开头部控制时可忽略
    head_link_name: "head_link2"

    # VR 头显参考 link（VR 校准时关联头显与机器人头部）
    # 由 VRInputHandler 使用；与 head_link_name 独立，即使不开头部控制也会生效
    reference_link: "head_link2"

